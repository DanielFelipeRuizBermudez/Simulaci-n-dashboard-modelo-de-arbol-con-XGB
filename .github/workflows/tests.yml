name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias
        run: pytest -v --ignore=tests/test_e2e.py --ignore=tests/test_app_smoke.py
      - name: Pruebas de punta a punta
        run: pytest -v tests/test_e2e.py tests/test_app_smoke.py
